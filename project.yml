name: CineBoard
options:
  bundleIdPrefix: com.example
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  CineBoard:
    type: application
    platform: iOS
    sources: [CineBoard]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: CineBoard
        TMDBAPIKey: "$(TMDB_API_KEY)"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CineBoard
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  CineBoardTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CineBoardTests]
    dependencies:
      - target: CineBoard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CineBoardTests
  CineBoardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CineBoardUITests]
    dependencies:
      - target: CineBoard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CineBoardUITests
schemes:
  CineBoard:
    build:
      targets:
        CineBoard: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [CineBoardTests, CineBoardUITests]
